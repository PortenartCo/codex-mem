name: Codex-Mem SQLite pilot (read-only CI)

on:
  push:
    branches:
      - fix/sqlite-only-recall-and-manual-save-20261011
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-mem-sqlite-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-pilot:
    name: SQLite-only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install dependencies without npm lifecycle hooks
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Run SQLite-only and existing search regression tests
        run: |
          bun test tests/sqlite tests/worker/search \
            tests/worker/manual-memory-sqlite-only.test.ts \
            tests/worker/bootstrap-memory.test.ts \
            tests/platform/codex-normalization.test.ts \
            tests/integration/worker-api-endpoints.test.ts \
            tests/server/loopback-security.test.ts
      - name: Rebuild distribution
        run: npm run build
      - name: Verify checked-in Worker matches reproducible local build
        run: git diff --exit-code -- plugin/scripts/worker-service.cjs
      - name: Create npm package without publishing
        run: npm pack --pack-destination "$RUNNER_TEMP" --silent
      - name: Verify packaged Worker matches tracked file
        run: |
          mkdir -p "$RUNNER_TEMP/package-check"
          tar -xf "$RUNNER_TEMP/codex-mem-cli-11.0.0.tgz" -C "$RUNNER_TEMP/package-check"
          cmp "plugin/scripts/worker-service.cjs" "$RUNNER_TEMP/package-check/package/plugin/scripts/worker-service.cjs"
          test -f "$RUNNER_TEMP/package-check/package/plugin/scripts/mcp-server.cjs"
          test -f "$RUNNER_TEMP/package-check/package/plugin/scripts/context-generator.cjs"
          test -f "$RUNNER_TEMP/package-check/package/plugin/ui/viewer-bundle.js"
          echo "PACKAGE_VERIFIED"
